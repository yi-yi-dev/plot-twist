<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PlotTwist</title>
        <link rel="stylesheet" href="css/style.css" />
        <meta
            name="description"
            content="PlotTwist is a tool for visualizing complex data interactively with multi-view support."
        />

        <meta
            property="og:title"
            content="PlotTwist - Interactive Data Visualization"
        />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="" />
        <!-- TODO: fill -->
        <meta
            property="og:image:alt"
            content="Screenshot of PlotTwist tool displaying complex data"
        />

        <link rel="icon" href="assets/favicon.ico" sizes="any" />
        <!-- TODO: replace -->
        <link rel="apple-touch-icon" href="assets/icon.png" />
        <!-- TODO: replace -->
        <link rel="manifest" href="site.webmanifest" />
    </head>

    <body>
        <div class="top-bar-dummy"></div>
        <div class="top-bar-fixedRectangle"></div>



        <div class="top-bar">
            <div class="top-bar-inner">

                <div class="indentFileUpload">
                    <label for="fileInput" class="custom-file-upload top-bar-button">
                        Upload data-set&nbsp;
                        <img src="assets/csv_icon.svg" alt="select CSV" class="csv-icon"/>
                    </label>
                    <input
                        type="file"
                        id="fileInput"
                        class="file-input"
                        accept=".csv,text/csv"
                    />
                </div>

                <button id="loadDemo" class="top-bar-button">
                    Olympic Demo&nbsp;
                    <img src="assets/launch_icon.svg" class="csv-icon" alt="load olympic demo">
                </button>

                <button id="loadAirQualityDemo" class="top-bar-button">
                    Air Quality Demo&nbsp;
                    <img src="assets/launch_icon.svg" class="csv-icon" alt="load air quality demo">
                </button>

                <button id="exportLayoutButton" class="top-bar-button">
                    Save Layout&nbsp;
                    <img src="assets/download_icon.svg" class="csv-icon" alt="download layout file">
                </button>

                <div id="loadLayoutButton" class="indentFileUpload">
                    <label for="layoutInput" class="custom-file-upload top-bar-button">
                        Load layout&nbsp;
                        <img src="assets/upload_icon.svg" alt="upload layout file" class="csv-icon">
                    </label>
                    <input type="file" id="layoutInput" class="file-input" accept=".json,text/json"/>
                </div>

            </div>
        </div>


        <div id="app-view">
            <section id="landing">
                <h1>Explore data together, in the browser</h1>
                <p>
                    PlotTwist lets several people explore related CSV tables at the same time.
                    Brush a region in any plot and the matching rows light up in every other plot,
                    on your screen and on everyone else's.
                </p>
                <div class="landing-video">
                    <video src="assets/demo/plottwist-demo.mp4" controls preload="metadata"></video>
                </div>
            </section>
            <div id="grid-container">
                <div id="plotsContainer"></div>
                <button id="col">+</button>
                <button id="row">+</button>
                <div></div>
            </div>
        </div>

        <div class="menu-wrapper">
            <div class="group-component">
                <div class="group-component-inner">
                    <span class="group-title">
                    Cross data-set links
                    </span>

                    <div class="group-component-buttons">
                        <button id="and-btn">And</button>
                        <button id="or-btn">Or</button>
                    </div>
                </div>


                <div id="groups-list"></div>

                <div class="add-group-container">
                    <label for="field-group-name">Link: </label>
                    <select id="field-group-name">
                    </select>
                    <button id="group-name-submit">Add Link</button>
                </div>
            </div>

            <button id="slide-menu-btn">
                <img src="assets/link_tonedDownPurple.svg" alt="Group links button">
                <!--Field Groups-->
            </button>
        </div>

        <button id="kill-session-btn" title="Reset session">
            <img src="assets/reset_icon.svg" alt="Reset session">
        </button>

        <script type="module" src="/js/main.js"></script>
    </body>
</html>
